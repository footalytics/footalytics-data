name: daily-csv-sync
on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 05:00 Beijing: right after European matchdays settle
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest settled predictions CSV
        run: |
          curl -fsSL --retry 3             "https://footalytics.farvor.com/api/public/accuracy/settled.csv"             -o data/settled-predictions.csv
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "csv-sync"
          git config user.email "csv-sync@users.noreply.github.com"
          git add data/settled-predictions.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "csv sync $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Count rows
        if: steps.commit.outputs.changed == 'true'
        id: count
        run: echo "n=$(( $(wc -l < data/settled-predictions.csv) - 1 ))" >> "$GITHUB_OUTPUT"
      - name: Notify Discord
        if: steps.commit.outputs.changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          N: ${{ steps.count.outputs.n }}
        run: |
          curl -fsSL -X POST -H "Content-Type: application/json"             -d "{\"content\":\"Sync done - **$N settled predictions** now in the CSV. Board: https://footalytics.farvor.com/accuracy\"}"             "$WEBHOOK" || true
      - name: Notify Telegram
        if: steps.commit.outputs.changed == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          N: ${{ steps.count.outputs.n }}
        run: |
          curl -fsSL -X POST             "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage"             -H "Content-Type: application/json"             -d "{\"chat_id\":\"$TG_CHAT_ID\",\"parse_mode\":\"HTML\",\"text\":\"Daily settlement update: <b>$N matches</b> now graded in the public CSV. Board: https://footalytics.farvor.com/accuracy\"}"             || true
