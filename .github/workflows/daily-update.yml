name: daily-csv-sync
on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 05:00 Beijing: right after European matchdays settle
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: [self-hosted, windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest settled predictions CSV
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 `
            "https://footalytics.farvor.com/api/public/accuracy/settled.csv" `
            -o data/settled-predictions.csv
      - name: Commit if changed
        id: commit
        shell: pwsh
        run: |
          git config user.name "csv-sync"
          git config user.email "csv-sync@users.noreply.github.com"
          git add data/settled-predictions.csv
          git diff --cached --quiet; $changed = ($LASTEXITCODE -ne 0)
          if ($changed) {
            git commit -m "csv sync"
            git push
          }
          $n = (Import-Csv data/settled-predictions.csv | Measure-Object).Count
          "changed=$(if ($changed) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "n=$n" >> $env:GITHUB_OUTPUT
      - name: Notify Discord
        if: steps.commit.outputs.changed == 'true'
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          N: ${{ steps.commit.outputs.n }}
        run: |
          $body = @{ content = "Sync done - **$env:N settled predictions** now in the CSV. Board: https://footalytics.farvor.com/accuracy" } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:WEBHOOK -Method Post -ContentType 'application/json' -Body $body
      - name: Notify Telegram
        if: steps.commit.outputs.changed == 'true'
        shell: pwsh
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          N: ${{ steps.commit.outputs.n }}
        run: |
          $body = @{ chat_id = $env:TG_CHAT_ID; parse_mode = 'HTML'; text = "Daily settlement update: <b>$env:N matches</b> now graded in the public CSV. Board: https://footalytics.farvor.com/accuracy" } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TG_BOT_TOKEN/sendMessage" -Method Post -ContentType 'application/json' -Body $body
