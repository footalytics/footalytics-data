name: daily-csv-sync
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest settled predictions CSV
        run: |
          curl -fsSL --retry 3             "https://footalytics.farvor.com/api/public/accuracy/settled.csv"             -o data/settled-predictions.csv
      - name: Commit if changed
        run: |
          git config user.name "csv-sync"
          git config user.email "csv-sync@users.noreply.github.com"
          git add data/settled-predictions.csv
          git diff --cached --quiet || git commit -m "csv sync $(date -u +%F)"
          git push
      - name: Notify Discord
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          N=$($(wc -l < data/settled-predictions.csv) - 1)
          curl -fsSL -X POST -H "Content-Type: application/json"             -d "{"content":"📊 footalytics-data daily sync done - **$N settled predictions** now in the CSV. Board: https://footalytics.farvor.com/accuracy"}"             "$WEBHOOK" || true
